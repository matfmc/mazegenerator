url: https://matfmc.github.io/mazegenerator/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: Generate, visualize, and solve mazes in R
  description: >
    An educational implementation of eleven maze generation algorithms (DFS,
    Prim, Kruskal, Wilson, Eller, recursive division, Aldous-Broder,
    hunt-and-kill, binary tree, sidewinder, growing tree) and seven
    pathfinding algorithms (A-star, Dijkstra, breadth-first search, greedy
    best-first search, bidirectional search, wall following, dead-end
    filling).

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/matfmc/mazegenerator
      aria-label: GitHub repository

reference:
  - title: Overview
    contents:
      - mazegenerator-package
  - title: Maze generation and display
    contents:
      - generate_maze
      - plot_maze
      - animate_maze
  - title: Post-processing
    contents:
      - braid
      - sparsify
      - set_endpoints
  - title: Pathfinding
    contents:
      - solve_maze
      - animate_solution
  - title: Analysis
    contents:
      - maze_stats

articles:
  - title: Learn the algorithm
    navbar: ~
    contents:
      - how-it-works
